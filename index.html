<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Guildmaster, step 7: the caravan and escorts</title>
<style>
:root{--panel:rgba(26,34,31,.93);--panel2:rgba(40,50,45,.95);--ink:#f1ead9;--muted:#b4bcaa;--brass:#d6a94a;--brass2:#f0c866;--line:rgba(241,234,217,.14);--red:#e0624f;--green:#86c86a;
--serif:"Palatino Linotype","Book Antiqua",Palatino,"Noto Serif",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#a9c7c2;color:var(--ink);font:15px/1.45 var(--sans);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
#hud{position:fixed;top:calc(var(--st) + 12px);left:calc(var(--sl) + 20px);right:calc(var(--sr) + 20px);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;display:flex;align-items:baseline;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.pill b{font:700 19px/1 var(--serif);color:var(--brass2)}
.pill b.tick{animation:tick .7s ease-out}@keyframes tick{0%{transform:scale(1.25);color:#fff}100%{transform:scale(1)}}
.pill small{color:var(--muted);font-size:12.5px}
#res{gap:11px;align-items:center}
#res span{display:flex;align-items:center;gap:4px}
#res svg{width:15px;height:15px;flex:none}
#res b{font:700 16px/1 var(--serif);color:var(--ink);min-width:1.2em}
#res.hungry #rf{color:var(--red)}
#hud .grow{flex:1}
.hb{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:40px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.hb:active{background:var(--panel2)}
#speedBtn{min-width:46px}
body.paused #pauseBtn{background:var(--brass);color:#1d1a12;border-color:transparent}
#roster{position:fixed;top:var(--hudb,calc(var(--st) + 62px));right:calc(var(--sr) + 20px);width:min(320px,calc(100vw - 40px));margin:0;padding:6px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:14px;max-height:50vh;overflow:auto}
#roster li,.stance li{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px}
#roster li{cursor:pointer}
#roster li:active,.stance li[data-adv]:active{background:rgba(255,255,255,.07)}
#roster img{width:26px;height:26px}
.nm{font-family:var(--serif);font-size:15.5px;white-space:nowrap}
.nm small{font-family:var(--sans);color:var(--muted);font-size:12px}
.st{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.st.on{color:var(--brass2)}.st.yes{color:var(--green)}.st.no{color:var(--red)}.st.busy{color:var(--muted)}.st.maybe{color:var(--ink)}
#toasts{position:fixed;top:var(--hudb,calc(var(--st) + 64px));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 48px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:rgba(22,28,26,.82);border-left:3px solid var(--muted);padding:6px 11px;border-radius:8px;font-size:13.5px;transition:opacity .5s}
.toast.good{border-color:var(--green)}.toast.bad{border-color:var(--red)}.toast.warn{border-color:#e6a23c}.toast.gold{border-color:var(--brass2)}
.toast.out{opacity:0}
#hint{position:fixed;left:50%;bottom:calc(var(--sb) + 28px);transform:translateX(-50%);background:var(--panel);border:1px solid var(--brass);border-radius:14px;padding:10px 16px;width:max-content;max-width:calc(100vw - 48px);text-align:center;font-family:var(--serif);font-size:16.5px;pointer-events:none}
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 16px);width:min(440px,calc(100vw - 40px));max-height:min(58vh,560px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px 16px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
@media (orientation:landscape) and (max-height:560px){#toasts{left:calc(var(--sl) + 20px);transform:none;width:min(380px,44vw)}#card{left:auto;right:calc(var(--sr) + 20px);transform:none;width:min(380px,48vw);max-height:calc(100vh - var(--st) - var(--sb) - 90px)}}
#card header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#card h2{font:600 21px/1.1 var(--serif);margin:0}
#card h3{font:600 15px var(--serif);color:var(--brass2);margin:14px 0 4px}
#card .sub{color:var(--muted);font-size:13px}
#card .x{margin-left:auto;background:none;border:none;font-size:17px;width:40px;height:40px;border-radius:10px;color:var(--muted)}
.tunic{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.3)}
.now{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.05);border-radius:12px;padding:10px}
.now img{width:40px;height:40px;flex:none}
.now b{font-family:var(--serif);font-size:16px}
.now p{margin:2px 0 0;color:var(--ink);font-size:14.5px}
.why{margin:10px 0 0;color:var(--ink);font-size:14.5px}
.grid{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-top:12px;align-items:center;font-size:14px}
.grid>span:nth-child(odd){color:var(--muted)}
.grid>span{min-width:0;display:flex;align-items:center}
.grid em{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:8px;white-space:nowrap}
.bar{display:inline-block;flex:1;max-width:190px;min-width:60px;height:8px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.bar.xp i{background:#7fb0e0}.bar.foe i{background:var(--red)}
details{margin-top:12px}
summary{color:var(--brass2);font-family:var(--serif);cursor:pointer;padding:4px 0}
ol{margin:6px 0 0;padding:0;list-style:none}
ol li{font-size:13.5px;padding:5px 0;border-top:1px solid var(--line)}
ol time{display:block;color:var(--muted);font-size:11.5px}
.stance{margin:0;padding:0;list-style:none}
.stance li[data-adv]{cursor:pointer}
.row{display:flex;gap:8px;margin-top:12px}
.row button{flex:1;min-height:44px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.row button.gold{background:var(--brass);color:#1f1a0e;border-color:transparent;font-weight:650}
.row button:disabled{opacity:.4;cursor:default}
#card .note{color:var(--muted);font-size:12.5px;margin:6px 0 0}
#won{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(15,20,18,.55)}
#won>div{background:var(--panel);border:1px solid var(--brass);border-radius:18px;padding:22px 26px;text-align:center;max-width:calc(100vw - 48px)}
#won h2{font:600 26px var(--serif);margin:0 0 6px;color:var(--brass2)}
#won button{margin-top:14px;min-height:44px;padding:0 22px;border-radius:11px;border:none;background:var(--brass);color:#1f1a0e;font-weight:650}
#tag{position:fixed;left:calc(var(--sl) + 20px);bottom:calc(var(--sb) + 6px);font-size:11px;color:rgba(20,30,25,.6);pointer-events:none}
.clsPick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.clsPick button{min-height:54px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.06);text-align:left;padding:8px 11px}
.clsPick button b{display:block;font:600 15.5px/1.2 var(--serif)}
.clsPick button small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:2px}
.clsPick button.on{border-color:var(--brass2);background:rgba(214,169,74,.2);box-shadow:inset 0 0 0 1px var(--brass2)}
.clsPick button.on b{color:var(--brass2)}
@media (orientation:landscape) and (max-height:560px){.clsPick{grid-template-columns:repeat(4,1fr);gap:6px}.clsPick button{min-height:44px;padding:6px 4px;text-align:center}.clsPick button small{display:none}.clsPick button b{font-size:14px}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.toast{transition:none}.pill b.tick{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="pill" title="Town treasury"><b id="gold">300g</b><small id="day">Day 1</small></div>
  <div class="pill" id="res" title="Town stores: wood, stone, food">
    <span><svg viewBox="0 0 16 16" aria-label="Wood"><rect x="1" y="5" width="14" height="6" rx="3" fill="#9a6a3c"/><circle cx="13" cy="8" r="2.4" fill="#d7ad76"/><circle cx="13" cy="8" r="1" fill="#9a6a3c"/></svg><b id="rw">0</b></span>
    <span><svg viewBox="0 0 16 16" aria-label="Stone"><path d="M2 11 4.5 4.5 10 3l4 4.5-1.5 5L6 13.5Z" fill="#b3aea3"/><path d="M4.5 4.5 10 3l-1 4Z" fill="#d6d1c5"/></svg><b id="rs">0</b></span>
    <span><svg viewBox="0 0 16 16" aria-label="Food"><path d="M8 15V5" stroke="#e0c16a" stroke-width="1.4"/><ellipse cx="8" cy="3.5" rx="1.6" ry="2.4" fill="#e0c16a"/><ellipse cx="5.4" cy="7" rx="1.4" ry="2.2" transform="rotate(-30 5.4 7)" fill="#e0c16a"/><ellipse cx="10.6" cy="7" rx="1.4" ry="2.2" transform="rotate(30 10.6 7)" fill="#e0c16a"/></svg><b id="rf">12</b></span>
  </div>
  <span class="grow"></span>
  <button class="hb" id="rosterBtn">Adventurers</button>
  <button class="hb" id="speedBtn" aria-label="Game speed">1×</button>
  <button class="hb" id="pauseBtn">Pause</button>
</div>
<ul id="roster" hidden></ul>
<div id="toasts"></div>
<div id="hint" hidden>Tap the wolf den to post a bounty</div>
<div id="card" hidden></div>
<div id="won" hidden><div><h2>Map cleared</h2><p id="wonText"></p><button id="againBtn">Play again</button></div></div>
<div id="tag">Step 7 test build: caravan, escorts, camp tiers</div>

    if (sheltering !== shelterShown) { shelterShown = sheltering; if (shelterCountSprite) { hallG.remove(shelterCountSprite); shelterCountSprite.material.map.dispose(); shelterCountSprite = null; } if (sheltering) { shelterCountSprite = textSprite('×' + sheltering, '#ffffff', 44); hallG.add(shelterCountSprite); } }
    if (shelterCountSprite) { shelterCountSprite.scale.set(sc * 0.55 * shelterCountSprite.userData.aspect, sc * 0.55, 1); shelterCountSprite.position.set(1.8 + sc * 0.7, 5.2 + sc * 0.3, 0); }
    // selection
    selRing.visible = false; line.visible = false; targetRing.visible = false;
    if (sel) {
      let sx, sz, r = 1;
      if (sel.kind === 'adv') { const a = advById(S, sel.id); if (a && !a.dead) { if (a.inside) { sx = 0; sz = 0; r = 4.2; } else { sx = a.x; sz = a.z; } } else if (!a || (a.dead && S.t - a.deadT > 2.5)) { select(null); } }
      else if (sel.kind === 'lair') { const L = lairById(S, sel.id); sx = L.x; sz = L.z; r = L.r + 2.3; }
      else if (sel.kind === 'hall') { sx = 0; sz = 0; r = 4.2; }
      else if (sel.kind === 'shop') { const D = CFG.shops[sel.id]; sx = D.x; sz = D.z; r = D.r + 1; }
      else if (sel.kind === 'array') { const A = arrayById(S, sel.id); sx = A.x; sz = A.z; r = 1.4; }
      else if (sel.kind === 'vil') { const u = vilById(S, sel.id); if (u && !u.dead) { if (u.inside) { sx = 0; sz = 0; r = 4.2; } else { sx = u.x; sz = u.z; r = 0.85; } } else if (!u || S.t - u.deadT > 2.5) select(null); }
      else if (sel.kind === 'mob') { const m = mobById(S, sel.id); if (m && !m.dead) { sx = m.x; sz = m.z; r = m.kind === 'bear' ? 1.6 : m.kind === 'wolf' || m.kind === 'deer' || m.kind === 'boar' ? 1.1 : 1; } else select(null); }
      else if (sel.kind === 'site') { const st = siteById(S, sel.id); sx = st.x; sz = st.z; r = CFG.siteKinds[st.kind].r + 1; }
      else if (sel.kind === 'flag') { const F = flagById(S, sel.id); if (F) { sx = F.x; sz = F.z; r = 1.3; } else select(null); }
      else if (sel.kind === 'ground') { sx = sel.x; sz = sel.z; r = CFG.flag.guardR / 0.8; }
      else if (sel.kind === 'caravan') { const C = S.caravan; if (C && C.id === sel.id) { sx = C.x; sz = C.z; r = 2.6; } }
      if (sx != null) { selRing.visible = true; selRing.position.set(sx, heightAt(sx, sz) + 0.07, sz); selRing.scale.setScalar(r); }
      if (sel && (sel.kind === 'adv' || sel.kind === 'vil' || sel.kind === 'mob')) {
        const a = sel.kind === 'mob' ? mobById(S, sel.id) : unitById(S, sel.id);
        if (a && !a.dead && !a.inside) {
          const t = sel.kind === 'adv' ? targetPos(a) : sel.kind === 'vil' ? vilTarget(a) : mobTarget(a);
          if (t) {
            const p = lineGeo.attributes.position; p.setXYZ(0, a.x, heightAt(a.x, a.z) + 0.2, a.z); p.setXYZ(1, t[0], heightAt(t[0], t[1]) + 0.2, t[1]); p.needsUpdate = true; line.computeLineDistances(); line.visible = true;
            targetRing.visible = true; targetRing.position.set(t[0], heightAt(t[0], t[1]) + 0.08, t[1]); targetRing.scale.setScalar(t[2] || 1);
          }
        }
      }
    }
    // floaters
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i]; f.t += dt; f.s.position.y += dt * 1.4;
      const k = sc * 0.6; f.s.scale.set(k * f.s.userData.aspect, k, 1); f.s.material.opacity = clamp(1.6 - f.t, 0, 1);
      if (f.t > 1.6) { scene.remove(f.s); f.s.material.map.dispose(); floaters.splice(i, 1); }
    }
  }
  function vilTarget(v) {
    if (v.state === 'toWork' || v.state === 'gather') { const st = siteById(S, v.site); if (st) { const w = workSpot(st, v); return [w[0], w[1], 0.6]; } }
    if (v.state === 'carry' || v.state === 'flee') { const d = doorOf(v); return [d[0], d[1], 0.9]; }
    if (v.wx != null) return [v.wx, v.wz, 0.5];
    return null;
  }
  function mobTarget(m) {
    if (m.wild) {
      if (wildAngry(m)) { const u = unitById(S, m.targetId); if (u && !u.dead && !u.inside) return [u.x, u.z, 0.8]; }
      if (m.state === 'back') return [m.home.x, m.home.z, 1.2];
      if (m.state === 'flee') { const u = m.fromId != null ? unitById(S, m.fromId) : null; return u && !u.dead && !u.inside ? [u.x, u.z, 0.8] : null; }
      return m.wx != null ? [m.wx, m.wz, 0.6] : null;
    }
    if (m.targetId != null) { const u = unitById(S, m.targetId); if (u && !u.dead && !u.inside) return [u.x, u.z, 0.8]; }
    if (m.state === 'raid') return [0, 0, 4.2];
    if (m.state === 'rob' && S.caravan) return [S.caravan.x, S.caravan.z, 2.2];
    if (m.state === 'return') { const L = lairById(S, m.lairId); return [L.x, L.z, L.r + 1.2]; }
    if (m.state === 'prowl' && m.goal) return [m.goal.x, m.goal.z, 1.5];
    return null;
  }
  function targetPos(a) {
    if (a.fightId) { const m = mobById(S, a.fightId); if (m && !m.dead) return [m.x, m.z, 0.8]; }
    if (a.state === 'chase' || a.state === 'game') { const m = mobById(S, a.target); if (m && !m.dead) return [m.x, m.z, 0.8]; }
    if (a.state === 'quest' || a.state === 'hunt') { const L = lairById(S, a.target); if (L) return [L.x, L.z, L.r + 1.2]; }
    if (a.state === 'shop') { const D = CFG.shops[a.target] || CFG.shops.alch; return [D.x, D.z, D.r + 0.6]; }
    if (a.state === 'retreat' || a.state === 'rest') { const d = doorOf(a); return [d[0], d[1], 0.9]; }
    if (a.state === 'flag') { const F = flagById(S, a.target); if (F) return a.sx != null && !a.onDuty ? [a.sx, a.sz, 0.6] : [F.x, F.z, 1.2]; }
    if (a.state === 'horn' && a.wx != null) return [a.wx, a.wz, 0.8];
    if (a.state === 'follow') { const b = advById(S, a.target); if (b && !b.dead && !b.inside) return [b.x, b.z, 0.8]; }
    if (a.state === 'escort' && S.caravan) return [S.caravan.x, S.caravan.z, 2.2];
    if (a.state === 'idle' && a.wx != null) return [a.wx, a.wz, 0.6];
    return null;
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0, uiT = 0, frameTimes = [];
  const DT = 1 / 30;
  GM.frameTimes = () => frameTimes.slice();
  GM.drawCalls = () => renderer.info.render.calls;
  function frame(now) {
    const real = Math.min(0.1, (now - last) / 1000); last = now;
    frameTimes.push(real * 1000); if (frameTimes.length > 600) frameTimes.shift();
    if (!paused) { acc += real * speed; let n = 0; while (acc >= DT && n < 12) { step(S, DT); acc -= DT; n++; } if (n === 12) acc = 0; }
    if (cam.follow) { const a = unitById(S, cam.follow); if (a && !a.dead) { const tx = a.inside ? 0 : a.x, tz = a.inside ? 0 : a.z; cam.x += (tx - cam.x) * Math.min(1, real * 4); cam.z += (tz - cam.z) * Math.min(1, real * 4); applyCam(); } else cam.follow = null; }
    pumpEvents();
    pumpShots(paused ? 0 : real * speed);
    sync(real, now);
    uiT -= real;
    if (uiT <= 0) {
      uiT = 0.2;
      $('gold').textContent = Math.floor(S.gold) + 'g';
      $('rw').textContent = S.res.wood; $('rs').textContent = S.res.stone; $('rf').textContent = Math.floor(S.res.food);
      $('res').classList.toggle('hungry', S.hungry);
      $('day').textContent = clock(S.t);
      renderCard(); updateRoster();
      // v3.3: the horn and the flag are taught when they first matter, at the first raid
      const raidHint = S.firstRaidT != null && S.t - S.firstRaidT < 25 && !S.stats.horns && !S.stats.flagsPlanted;
      // step 7: the escort bounty is taught when the first caravans come, until the player posts one
      const cvHint = !raidHint && S.caravan && S.caravan.id <= 2 && S.caravan.state !== 'wreck' && !S.ledger.escorts && (S.caravan.state !== 'out' || S.caravan.food > 0);
      // step 6: the blacksmith is taught when an adventurer first has gold for gear and nowhere to buy it
      const smithHint = !raidHint && !cvHint && S.everPosted && !S.shops.smith.built && aliveAdv(S).some(a => (a.weapon < 1 || a.armour < 1) && a.gold >= CFG.gear.price[1]);
      const den = lairById(S, 'den'), clsHint = !raidHint && !cvHint && !smithHint && S.everPosted && !S.pickedCls && aliveAdv(S).length < CFG.maxAdv && ((den && !den.alive) || S.t > 75) && S.t < 170;
      const ht = raidHint ? 'Bandits are raiding. Tap the guild hall to sound the recall horn or plant a defend flag'
        : cvHint ? 'A merchant caravan has come for your surplus food, and bandits will go for it. Tap the wagon to post an escort bounty'
        : smithHint ? 'An adventurer has gold for better gear. Tap the empty plot in front of the guild hall to build a blacksmith'
        : clsHint ? 'Tap the guild hall to choose who it recruits next: warrior, archer, magician or healer' : 'Tap the wolf den to post a bounty';
      if (hint.textContent !== ht) hint.textContent = ht;
      hint.hidden = !!sel || (!raidHint && !cvHint && !clsHint && !smithHint && (S.everPosted || S.t < 2));   // never under an open card
      if (S.won && $('won').hidden) { $('won').hidden = false; $('wonText').textContent = `Every threat is gone, on day ${Math.floor(S.wonT / 60) + 1}.`; }
    }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  GM.ready = true;
}

})();
</script>
